<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Fallback lock for when this page is opened in a browser. The desktop app applies its own, equally strict policy. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src ipc: http://ipc.localhost; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="description" content="Cloakroom swaps private details for tickets before text reaches an AI, then swaps them back. Offline and encrypted on this computer.">
<title>Cloakroom</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-mask-on" viewBox="0 0 24 24"><path d="M3 8.5c3-1.8 6-2 9-.6 3-1.4 6-1.2 9 .6 0 5.2-2.6 8.6-6 8.6-2 0-3-1.4-3-1.4s-1 1.4-3 1.4c-3.4 0-6-3.4-6-8.6Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/><circle cx="8" cy="12" r="1.6" fill="currentColor"/><circle cx="16" cy="12" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-mask-off" viewBox="0 0 24 24"><path d="M3 8.5c3-1.8 6-2 9-.6 3-1.4 6-1.2 9 .6 0 5.2-2.6 8.6-6 8.6-2 0-3-1.4-3-1.4s-1 1.4-3 1.4c-3.4 0-6-3.4-6-8.6Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" stroke-dasharray="3 2.4"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></symbol>
    <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M4 7h16v3.2a1.8 1.8 0 0 0 0 3.6V17H4v-3.2a1.8 1.8 0 0 0 0-3.6Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/><path d="M10 7v10" stroke="currentColor" stroke-width="1.75" stroke-dasharray="1.5 2.5"/></symbol>
    <symbol id="i-offline" viewBox="0 0 24 24"><path d="M3 9.5a13 13 0 0 1 18 0M6.5 13a8 8 0 0 1 11 0M10 16.4a3 3 0 0 1 4 0M4 4l16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="1.75"/></symbol>
  </defs>
</svg>

<div class="app">
  <aside class="sidebar">
    <div class="drag" data-tauri-drag-region></div>
    <div class="brand" data-tauri-drag-region>
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 14a6 6 0 1 1 6 6c-3 0-6 2-6 5v3" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M32 28 7 44a3 3 0 0 0 2 6h46a3 3 0 0 0 2-6Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>
      <span>Cloakroom</span>
    </div>
    <nav aria-label="Rooms">
      <div class="path">
        <button type="button" class="stop on" data-tab="mask" aria-current="page"><svg class="ico" aria-hidden="true"><use href="#i-mask-on"/></svg><span>Check in</span></button>
        <div class="stop waypoint"><span class="node" aria-hidden="true"></span><span>Claude</span></div>
        <button type="button" class="stop" data-tab="restore"><svg class="ico" aria-hidden="true"><use href="#i-mask-off"/></svg><span>Pick up</span></button>
      </div>
      <div class="backroom">
        <button type="button" class="stop" data-tab="lists"><svg class="ico" aria-hidden="true"><use href="#i-list"/></svg><span>Watch lists</span></button>
        <button type="button" class="stop" data-tab="key"><svg class="ico" aria-hidden="true"><use href="#i-ticket"/></svg><span>Tickets</span></button>
      </div>
    </nav>
    <div class="status">
      <div class="pill"><svg class="mini" aria-hidden="true"><use href="#i-offline"/></svg><span>Offline</span></div>
      <div class="pill" id="encPill"><svg class="mini" aria-hidden="true"><use href="#i-lock"/></svg><span id="encLabel">Encrypted on this computer</span></div>
      <div class="meta" id="ticketCount"></div>
    </div>
  </aside>

  <main>
    <div class="topdrag" data-tauri-drag-region></div>

    <!-- CHECK IN: real text goes in on the left, the disguised text comes out on the right -->
    <section id="mask" class="room on">
      <header><h1>Check in</h1></header>
      <div class="rail">
        <div class="col">
          <div class="pane">
            <div class="panehead"><h2>Your text</h2><span class="meta" id="modeInfo"></span></div>
            <textarea id="input" class="drop" aria-label="Your text" placeholder="Paste text or a table, or drop a file"></textarea>
            <div class="row">
              <label class="btn">Open file…<input id="file" type="file" accept=".csv,.tsv,.txt,.md" hidden></label>
              <button type="button" class="btn ghost" id="clearIn">Clear</button>
            </div>
          </div>
          <div class="pane">
            <div class="panehead"><h2>Found</h2></div>
            <div id="columns"></div>
            <div class="find" id="findings"><div class="empty">Nothing yet.</div></div>
            <div class="row">
              <input type="text" id="addVal" class="grow" aria-label="Something I missed" placeholder="Something I missed">
              <select id="addType" aria-label="Type"></select>
              <button type="button" class="btn" id="addBtn">Add</button>
            </div>
          </div>
        </div>
        <div class="door">
          <button type="button" class="btn primary" id="maskBtn">Check in</button>
          <span class="meta" id="maskInfo"></span>
        </div>
        <div class="pane costume">
          <div class="panehead"><h2>Disguised</h2><label class="check"><input type="checkbox" id="addNote" checked> Add a note for Claude</label></div>
          <textarea id="output" readonly aria-label="Disguised text" placeholder="Ready to send"></textarea>
          <div class="row"><button type="button" class="btn" id="copyOut">Copy</button></div>
          <div id="maskWarn"></div>
        </div>
      </div>
    </section>

    <!-- PICK UP: Claude's disguised reply goes in on the left, the real text comes out on the right -->
    <section id="restore" class="room">
      <header><h1>Pick up</h1></header>
      <div class="rail">
        <div class="pane costume">
          <div class="panehead"><h2>Claude’s reply</h2><span class="meta" id="rFileInfo"></span></div>
          <textarea id="rin" class="drop" aria-label="Claude's reply" placeholder="Paste Claude's reply, or drop a file"></textarea>
          <div class="row">
            <label class="btn">Open file…<input id="rfile" type="file" accept=".txt,.csv,.tsv,.md" hidden></label>
            <button type="button" class="btn ghost" id="clearR">Clear</button>
          </div>
        </div>
        <div class="door">
          <button type="button" class="btn primary" id="restoreBtn">Pick up</button>
          <span class="meta" id="rInfo"></span>
        </div>
        <div class="pane">
          <div class="panehead"><h2>Your text, restored</h2></div>
          <textarea id="rout" readonly aria-label="Restored text"></textarea>
          <div class="row"><button type="button" class="btn" id="copyR">Copy</button><button type="button" class="btn" id="saveR" disabled>Save as file…</button></div>
          <div id="rWarn"></div>
        </div>
      </div>
      <div id="donePanel" class="leave" style="display:none">
        <label class="check"><input type="checkbox" id="doneLists"> Also erase my watch lists</label>
        <button type="button" class="btn danger" id="doneBtn">Erase everything now</button>
      </div>
    </section>

    <!-- WATCH LISTS -->
    <section id="lists" class="room">
      <header><h1>Watch lists</h1></header>
      <div class="pair">
        <div class="pane"><div class="panehead"><h2>People</h2></div><textarea id="people" class="tall" aria-label="People" placeholder="Jane Smith"></textarea></div>
        <div class="pane"><div class="panehead"><h2>Organizations</h2></div><textarea id="orgs" class="tall" aria-label="Organizations" placeholder="Example Foundation"></textarea></div>
      </div>
      <p class="meta" id="listInfo"></p>
    </section>

    <!-- TICKETS -->
    <section id="key" class="room">
      <header><h1>Tickets</h1></header>
      <div class="pair">
        <div class="pane">
          <div class="group">
            <label class="panehead" for="retention"><h2>Erase tickets after</h2></label>
            <select id="retention"><option value="1">1 day</option><option value="3">3 days</option><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option><option value="0">Never</option></select>
          </div>
          <div class="group">
            <div class="panehead"><h2>Key</h2><span class="meta">Exports are not encrypted</span></div>
            <div class="row">
              <button type="button" class="btn" id="exportBtn">Export key…</button>
              <label class="btn">Import key…<input id="importFile" type="file" accept=".json" hidden></label>
            </div>
          </div>
          <div class="group last">
            <button type="button" class="btn danger" id="wipeBtn">Erase all</button>
          </div>
          <div id="storeWarn"></div>
        </div>
        <div class="pane">
          <div class="panehead"><h2>Your tickets</h2><input type="search" id="vq" aria-label="Search tickets" placeholder="Search"></div>
          <div class="vaultwrap"><table class="vault" id="vault"></table></div>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal" hidden>
  <div class="box" role="dialog" aria-modal="true">
    <p id="modalMsg"></p>
    <div class="row end"><button type="button" class="btn ghost" id="modalNo">Cancel</button><button type="button" class="btn danger" id="modalYes">OK</button></div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
